<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="statsRounded"><rect width="480" height="200" rx="16"/></clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#statsRounded)">
    <rect width="480" height="200" fill="#111827"/>
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">GitHub Stats</text>

    <!-- rank ring -->
    <g transform="translate(90,115)">
      <circle r="55" fill="none" stroke="#ffffff10" stroke-width="10"/>
      <circle r="55" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="345" stroke-dashoffset="345" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="345" to="72" dur="1.6s" begin="0.3s" fill="freeze"/>
      </circle>
      <text text-anchor="middle" dy="8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">A+</text>
    </g>

    <!-- stat rows -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c4b5fd">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
        <text x="190" y="60">⭐ Total Stars</text>
        <text x="440" y="60" text-anchor="end" fill="#38bdf8">held</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
        <text x="190" y="90">📦 Total Commits</text>
        <text x="440" y="90" text-anchor="end" fill="#38bdf8">active</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1s" fill="freeze"/>
        <text x="190" y="120">🔀 Pull Requests</text>
        <text x="440" y="120" text-anchor="end" fill="#93c5fd">merged</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
        <text x="190" y="150">🐛 Issues</text>
        <text x="440" y="150" text-anchor="end" fill="#93c5fd">tracked</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
        <text x="190" y="180">🔥 Contribution streak</text>
      </g>
    </g>
  </g>
</svg>
