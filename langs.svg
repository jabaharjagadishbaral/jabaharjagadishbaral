<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="langsRounded"><rect width="480" height="200" rx="16"/></clipPath></defs>
  <g clip-path="url(#langsRounded)">
    <rect width="480" height="200" fill="#111827"/>
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Most Used Languages</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c4b5fd">
      <text x="20" y="58">JavaScript</text>
      <rect x="90" y="48" width="360" height="12" rx="6" fill="#ffffff10"/>
      <rect x="90" y="48" height="12" rx="6" fill="#f1e05a" width="0"><animate attributeName="width" from="0" to="122" dur="1s" begin="0.3s" fill="freeze"/></rect>
      <text x="460" y="58" text-anchor="end">33.9%</text>

      <text x="20" y="88">HTML</text>
      <rect x="90" y="78" width="360" height="12" rx="6" fill="#ffffff10"/>
      <rect x="90" y="78" height="12" rx="6" fill="#e34c26" width="0"><animate attributeName="width" from="0" to="92" dur="1s" begin="0.5s" fill="freeze"/></rect>
      <text x="460" y="88" text-anchor="end">25.4%</text>

      <text x="20" y="118">TypeScript</text>
      <rect x="90" y="108" width="360" height="12" rx="6" fill="#ffffff10"/>
      <rect x="90" y="108" height="12" rx="6" fill="#3178c6" width="0"><animate attributeName="width" from="0" to="61" dur="1s" begin="0.7s" fill="freeze"/></rect>
      <text x="460" y="118" text-anchor="end">16.9%</text>

      <text x="20" y="148">Python</text>
      <rect x="90" y="138" width="360" height="12" rx="6" fill="#ffffff10"/>
      <rect x="90" y="138" height="12" rx="6" fill="#3776ab" width="0"><animate attributeName="width" from="0" to="58" dur="1s" begin="0.9000000000000001s" fill="freeze"/></rect>
      <text x="460" y="148" text-anchor="end">16.0%</text>

      <text x="20" y="178">CSS</text>
      <rect x="90" y="168" width="360" height="12" rx="6" fill="#ffffff10"/>
      <rect x="90" y="168" height="12" rx="6" fill="#563d7c" width="0"><animate attributeName="width" from="0" to="18" dur="1s" begin="1.1s" fill="freeze"/></rect>
      <text x="460" y="178" text-anchor="end">5.1%</text>

    </g>
  </g>
</svg>
