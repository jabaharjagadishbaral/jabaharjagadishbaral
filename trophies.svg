<svg width="980" height="180" viewBox="0 0 980 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="trophyRounded"><rect width="980" height="180" rx="16"/></clipPath>
    <linearGradient id="shineTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#trophyRounded)">
    <rect width="980" height="180" fill="#111827"/>

    <!-- 5 trophy cells -->
    <g font-family="Segoe UI, Arial, sans-serif">
      <!-- template repeated with offsets -->
      <g transform="translate(20,20)">
        <rect width="176" height="140" rx="12" fill="#1e1b4b" stroke="#38bdf8" stroke-opacity="0" >
          <animate attributeName="stroke-opacity" from="0" to="0.7" dur="0.4s" begin="0.2s" fill="freeze"/>
        </rect>
        <text x="88" y="55" font-size="34" text-anchor="middle" opacity="0">🏆<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/></text>
        <text x="88" y="85" font-size="12" fill="#38bdf8" text-anchor="middle">Quiz Winner</text>
        <text x="88" y="105" font-size="11" fill="#c4b5fd" text-anchor="middle">2nd Prize</text>
        <text x="88" y="125" font-size="10" fill="#9ca3af" text-anchor="middle">Technical Quiz</text>
      </g>
      <g transform="translate(220,20)">
        <rect width="176" height="140" rx="12" fill="#1e1b4b" stroke="#cbd5e1" stroke-opacity="0">
          <animate attributeName="stroke-opacity" from="0" to="0.7" dur="0.4s" begin="0.4s" fill="freeze"/>
        </rect>
        <text x="88" y="55" font-size="34" text-anchor="middle" opacity="0">🥈<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/></text>
        <text x="88" y="85" font-size="12" fill="#cbd5e1" text-anchor="middle">Math Olympiad</text>
        <text x="88" y="105" font-size="11" fill="#c4b5fd" text-anchor="middle">3rd Prize</text>
        <text x="88" y="125" font-size="10" fill="#9ca3af" text-anchor="middle">Mathematics</text>
      </g>
      <g transform="translate(420,20)">
        <rect width="176" height="140" rx="12" fill="#1e1b4b" stroke="#93c5fd" stroke-opacity="0">
          <animate attributeName="stroke-opacity" from="0" to="0.7" dur="0.4s" begin="0.6s" fill="freeze"/>
        </rect>
        <text x="88" y="55" font-size="34" text-anchor="middle" opacity="0">📸<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.6s" fill="freeze"/></text>
        <text x="88" y="85" font-size="12" fill="#93c5fd" text-anchor="middle">Photography</text>
        <text x="88" y="105" font-size="11" fill="#c4b5fd" text-anchor="middle">1st Prize</text>
        <text x="88" y="125" font-size="10" fill="#9ca3af" text-anchor="middle">Photo Competition</text>
      </g>
      <g transform="translate(620,20)">
        <rect width="176" height="140" rx="12" fill="#1e1b4b" stroke="#38bdf8" stroke-opacity="0">
          <animate attributeName="stroke-opacity" from="0" to="0.7" dur="0.4s" begin="0.8s" fill="freeze"/>
        </rect>
        <text x="88" y="55" font-size="34" text-anchor="middle" opacity="0">🎖️<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
        <text x="88" y="85" font-size="12" fill="#38bdf8" text-anchor="middle">NCC</text>
        <text x="88" y="105" font-size="11" fill="#c4b5fd" text-anchor="middle">CQMS Rank</text>
        <text x="88" y="125" font-size="10" fill="#9ca3af" text-anchor="middle">National Cadet Corps</text>
      </g>
      <g transform="translate(820,20)">
        <rect width="140" height="140" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-opacity="0">
          <animate attributeName="stroke-opacity" from="0" to="0.7" dur="0.4s" begin="1s" fill="freeze"/>
        </rect>
        <text x="70" y="55" font-size="34" text-anchor="middle" opacity="0">🎓<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/></text>
        <text x="70" y="85" font-size="12" fill="#7c3aed" text-anchor="middle">Leadership</text>
        <text x="70" y="105" font-size="11" fill="#c4b5fd" text-anchor="middle">Team Lead</text>
        <text x="70" y="125" font-size="10" fill="#9ca3af" text-anchor="middle">Tech Fests</text>
      </g>
    </g>

    <rect x="-260" y="0" width="120" height="180" fill="url(#shineTrophy)" transform="skewX(-20)">
      <animate attributeName="x" values="-260;1000" dur="4s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
